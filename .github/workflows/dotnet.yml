name: .NET

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./LcfSharp/LcfSharp.csproj

    - name: Build
      run: dotnet build --configuration Release --no-restore ./LcfSharp/LcfSharp.csproj

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./LcfSharp/LcfSharp.csproj

    - name: Build
      run: dotnet build --configuration Release --no-restore ./LcfSharp/LcfSharp.csproj

    - name: Pack NuGet package
      run: dotnet pack --configuration Release --no-build --output ./nupkg ./LcfSharp/LcfSharp.csproj

    - name: Publish NuGet package to GitHub Packages
      run: >
        dotnet nuget push ./nupkg/*.nupkg
        --api-key "${{ secrets.GITHUB_TOKEN }}"
        --skip-duplicate
        --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: Authenticate with NuGet.org
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish NuGet package to NuGet.org
      run: >
        dotnet nuget push ./nupkg/*.nupkg
        --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
        --skip-duplicate
        --source "https://api.nuget.org/v3/index.json"